<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lale OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Düzen: tam ekran masaüstü; altta cam görev çubuğu, üstünde sürüklenebilir pencereler */
:root{
  --win:#1d1a26; --win-2:#262231; --win-3:#302b3d;
  --line:rgba(255,255,255,.09); --fg:#efeaf5; --muted:#a59db4;
  --glass:rgba(24,20,34,.72); --accent:#f0587d; --on-accent:#fff;
  --ok:#4fd1a1; --warn:#f2b84b; --bad:#ff6b6b;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --tb-h:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#140f1e;color:var(--fg);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

#os{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;width:100%;height:100%;display:block}

/* masaüstü simgeleri */
#icons{position:absolute;top:env(safe-area-inset-top,0px);left:0;bottom:var(--tb-h);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);grid-auto-columns:88px;gap:6px;align-content:start}
.dicon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;text-align:center;font-size:12px;line-height:1.25;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.sel{background:rgba(255,255,255,.18)}
.ico{display:inline-grid;place-items:center;border-radius:28%;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.3);flex:none}
.ico svg{width:58%;height:58%;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* pencereler */
#layer{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:var(--tb-h);pointer-events:none}
#layer>.win{pointer-events:auto}
#layer>.win.min{pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);overflow:hidden;min-width:260px;min-height:160px;transition:opacity .16s,transform .16s}
.win.opening{opacity:0;transform:scale(.96) translateY(8px)}
.win.min{opacity:0;transform:scale(.9) translateY(40px);pointer-events:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.win.closing{opacity:0;transform:scale(.96)}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--win-2);border-bottom:1px solid var(--line);cursor:default;touch-action:none}
.win:not(.active) .tb{background:var(--win)}
.win:not(.active) .tt{color:var(--muted)}
.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.tbtns{display:flex;gap:2px}
.tbtns button{width:32px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.tbtns button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.tbtns .b-close:hover{background:var(--accent);color:var(--on-accent)}
.tbtns svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.wb{flex:1;min-height:0;position:relative;overflow:hidden;user-select:text;-webkit-user-select:text}
.rz{position:absolute;z-index:2;touch-action:none}
.rz-r{top:0;right:-3px;width:8px;bottom:12px;cursor:ew-resize}
.rz-b{left:0;bottom:-3px;height:8px;right:12px;cursor:ns-resize}
.rz-br{right:-2px;bottom:-2px;width:16px;height:16px;cursor:nwse-resize}
.win.max .rz{display:none}

/* görev çubuğu */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tb-h) + env(safe-area-inset-bottom,0px));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);z-index:100000}
#startbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accent);flex:none}
#startbtn:hover,#startbtn.on{background:rgba(255,255,255,.1)}
#startbtn svg{width:26px;height:26px}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
.task{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 8px;border-radius:10px;flex:0 1 190px;min-width:48px;overflow:hidden;position:relative;color:var(--muted)}
.task:hover{background:rgba(255,255,255,.07)}
.task.active{background:rgba(255,255,255,.12);color:var(--fg)}
.task::after{content:"";position:absolute;left:50%;bottom:3px;width:6px;height:3px;border-radius:2px;background:var(--muted);transform:translateX(-50%);transition:width .15s}
.task.active::after{width:18px;background:var(--accent)}
.task .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#tray{display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;height:44px;justify-content:center;border-radius:10px;font-variant-numeric:tabular-nums;flex:none}
#tray:hover{background:rgba(255,255,255,.07)}
#tray .t{font-weight:600;font-size:13px}
#tray .d{font-size:11px;color:var(--muted)}

/* başlat menüsü */
#start{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(var(--tb-h) + env(safe-area-inset-bottom,0px) + 8px);width:min(460px,calc(100vw - 16px));max-height:calc(100% - var(--tb-h) - 24px);display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:100001;overflow:hidden;transform-origin:bottom left;transition:opacity .15s,transform .15s}
#start.hide{opacity:0;transform:translateY(10px) scale(.98);pointer-events:none}
.st-head{padding:18px 18px 10px}
.st-head h2{margin:0 0 12px;font:600 18px var(--f-display);text-wrap:balance}
#st-search{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:0 14px;outline:none}
#st-search:focus{border-color:var(--accent)}
.st-label{padding:6px 18px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#st-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:0 12px 12px;overflow-y:auto}
.st-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:12px;font-size:12px;text-align:center}
.st-app:hover,.st-app.first{background:rgba(255,255,255,.09)}
.st-empty{grid-column:1/-1;padding:20px;color:var(--muted);text-align:center}
.st-foot{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-family:var(--f-display);flex:none}
.st-user{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-foot button{height:34px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.st-foot button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.st-foot svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* bağlam menüsü ve bildirim */
.ctx{position:fixed;min-width:190px;padding:5px;background:var(--win-2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:100002;font-size:13px}
.ctx button{display:flex;width:100%;text-align:left;padding:8px 12px;border-radius:6px}
.ctx button:hover{background:var(--accent);color:var(--on-accent)}
.ctx button.danger{color:var(--bad)}
.ctx button.danger:hover{background:var(--bad);color:#fff}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#toasts{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:100003;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;background:var(--win-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:13px;max-width:320px;animation:tin .2s ease-out}
.toast.err{border-left-color:var(--bad)}
.toast button{color:var(--accent);font-weight:600}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* kilit, açılış, kapanış */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#lock{z-index:200000;background:rgba(10,6,18,.35);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);cursor:pointer;transition:opacity .35s,transform .35s}
#lock.hide{opacity:0;transform:translateY(-30px);pointer-events:none}
#lock .clock{font:700 clamp(64px,16vw,120px)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#lock .date{font-size:18px;color:rgba(255,255,255,.85)}
#lock .hint{margin-top:40px;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.04em}
#boot{z-index:300000;background:#0d0914;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
#boot svg{width:72px;height:72px;color:var(--accent)}
#boot .name{font:600 26px var(--f-display);letter-spacing:.02em}
#boot .ver{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.bar{width:180px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
#off{z-index:300001;background:#000}
#off p{color:#8c8499;margin:0}
.btn{height:36px;padding:0 16px;border-radius:9px;background:var(--win-3);border:1px solid var(--line);font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#3a344a}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ortak uygulama parçaları */
.app{display:flex;flex-direction:column;height:100%}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--win)}
.toolbar .sp{flex:1}
.statusbar{padding:5px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.field{height:30px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:0 10px;outline:none;min-width:0}
.field:focus{border-color:var(--accent)}

/* dosyalar */
.fm{display:flex;height:100%}
.fm-side{width:160px;flex:none;padding:10px 8px;border-right:1px solid var(--line);background:rgba(0,0,0,.12);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.fm-side .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
.fm-side button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;text-align:left;font-size:13px}
.fm-side button:hover{background:rgba(255,255,255,.06)}
.fm-side button.on{background:rgba(255,255,255,.1);color:var(--fg)}
.fm-side svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fm-main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;font-size:13px}
.crumbs button{padding:4px 7px;border-radius:6px;white-space:nowrap}
.crumbs button:hover{background:rgba(255,255,255,.08)}
.crumbs span{color:var(--muted)}
.iconbtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn:disabled{opacity:.35;cursor:default;background:none}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fm-grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:max-content;gap:6px;outline:none}
.fm-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:9px;font-size:12px;text-align:center;word-break:break-word;border:1px solid transparent}
.fm-item:hover{background:rgba(255,255,255,.05)}
.fm-item.sel{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.fm-item svg{width:44px;height:44px}
.fm-item input{width:100%;font-size:12px;text-align:center;padding:2px 4px;border-radius:4px;border:1px solid var(--accent);background:var(--win);outline:none}
.fm-empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);padding:40px 10px}

/* not defteri */
.np textarea{flex:1;resize:none;border:0;outline:none;background:var(--win);padding:16px 18px;font:14px/1.6 var(--f-mono);color:var(--fg);tab-size:4}

/* terminal */
.term{flex:1;min-height:0;background:#120f18;font:13px/1.55 var(--f-mono);padding:12px 14px;overflow-y:auto;cursor:text;color:#ddd6e8}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .err{color:var(--bad)}
.term .dim{color:#8a8298}
.term .acc{color:var(--accent)}
.term .grn{color:var(--ok)}
.term .row{display:flex;gap:8px}
.keybar{display:none;gap:4px;padding:6px;background:#120f18;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.keybar button{flex:none;min-width:44px;height:38px;padding:0 12px;border-radius:8px;background:var(--win-2);font:500 14px var(--f-mono);touch-action:manipulation}
.keybar button:active{background:var(--accent);color:var(--on-accent)}
@media (pointer:coarse){.keybar{display:flex}}
#os.kb #taskbar{display:none}
#os.kb #layer,#os.kb #icons{bottom:0}
#os.kb #start{display:none}
.term .row input{flex:1;min-width:0;background:none;border:0;outline:none;font:inherit;color:inherit;padding:0;caret-color:var(--accent)}
.term .ps{white-space:nowrap}
.term .ps b{color:var(--ok);font-weight:600}
.term .ps i{color:var(--accent);font-style:normal}

/* hesap makinesi */
.calc{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;background:var(--win)}
.calc .disp{background:rgba(0,0,0,.28);border-radius:12px;padding:12px 16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc .ex{font:400 15px var(--f-mono);color:var(--muted);min-height:22px;word-break:break-all}
.calc .res{font:600 34px/1.2 var(--f-display);font-variant-numeric:tabular-nums;word-break:break-all}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{border-radius:10px;background:var(--win-2);font:500 18px var(--f-display);min-height:42px}
.calc .keys button:hover{background:var(--win-3)}
.calc .keys .op{color:var(--accent)}
.calc .keys .fn{color:var(--muted)}
.calc .keys .eq{grid-column:1/-1;background:var(--accent);color:var(--on-accent)}
.calc .keys .eq:hover{filter:brightness(1.08);background:var(--accent)}

/* ayarlar */
.set{height:100%;overflow-y:auto;padding:20px max(16px,4%);display:flex;flex-direction:column;gap:22px}
.set h3{margin:0 0 10px;font:600 15px var(--f-display)}
.set .card{background:var(--win-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.walls button{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);text-align:left}
.walls canvas{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:8px;border:2px solid transparent;display:block}
.walls button.on canvas{border-color:var(--accent)}
.walls button.on{color:var(--fg)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{border-color:var(--fg)}
.set .rowf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .about{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.set .about dt{color:var(--muted)}
.set .about dd{margin:0;font-variant-numeric:tabular-nums}

/* çizim */
.paint .toolbar input[type=color]{width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
.paint .sw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.paint .sw.on{box-shadow:0 0 0 2px var(--win),0 0 0 4px var(--fg)}
.paint .stage{flex:1;min-height:0;position:relative;background:#fff;touch-action:none;cursor:crosshair}
.paint canvas{position:absolute;inset:0;width:100%;height:100%}
.tog.on{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* takvim */
.cal{height:100%;display:flex;flex-direction:column;padding:16px;gap:12px;overflow-y:auto}
.cal .head{display:flex;align-items:center;gap:8px}
.cal .head h3{flex:1;margin:0;font:600 18px var(--f-display)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.cal .dn{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.cal .d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:9px;position:relative;font-size:13px}
.cal .d.o{color:#5d566b}
.cal .d.we{color:var(--muted)}
.cal .d.today{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .d.hol::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.cal .d.today.hol::after{background:#fff}
.cal .hols{display:flex;flex-direction:column;gap:6px;font-size:13px}
.cal .hols div{display:flex;gap:10px;align-items:baseline}
.cal .hols b{color:var(--warn);font-variant-numeric:tabular-nums;min-width:52px}

/* yılan */
.snake{height:100%;display:flex;flex-direction:column;background:#100d16}
.snake .stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
.snake canvas{max-width:100%;max-height:100%;aspect-ratio:1;border-radius:10px;background:#17131f}
.snake .pad{display:none;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;padding:0 0 12px}
.snake .pad button{height:44px;border-radius:10px;background:var(--win-2)}
.snake .pad svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (pointer:coarse){.snake .pad{display:grid}}

/* ritim koşusu */
.dash{height:100%;display:flex;flex-direction:column;background:#0d0914}
.dash canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none;cursor:pointer}
.dash-hud{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.dash-hud .sp{flex:1}
.dash-hud .d-best{color:var(--muted)}

/* sistem izleyici */
.mon{height:100%;display:flex;flex-direction:column;overflow-y:auto}
.mon .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:14px}
.mon .kpi{background:var(--win-2);border-radius:10px;padding:10px 12px}
.mon .kpi span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mon .kpi b{font:600 20px var(--f-display);font-variant-numeric:tabular-nums}
.mon canvas{display:block;width:calc(100% - 28px);height:90px;margin:0 14px;border-radius:10px;background:var(--win-2)}
.mon table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mon .tw{padding:14px;overflow-x:auto}
.mon th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
.mon td{padding:6px 8px;border-bottom:1px solid var(--line)}
.mon td:first-child{display:flex;align-items:center;gap:8px}

.viewer{height:100%;display:grid;place-items:center;background:repeating-conic-gradient(#2a2633 0 25%,#221f2a 0 50%) 0 0/20px 20px;padding:12px;overflow:auto}
.viewer img{max-width:100%;max-height:100%;box-shadow:0 6px 24px rgba(0,0,0,.4)}

@media (max-width:640px){
  #icons{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);grid-template-rows:none;grid-auto-rows:96px;grid-auto-columns:auto;right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .task .lbl{display:none}
  .task{padding:0 10px;flex:none}
  .fm-side{display:none}
  #tray .d{display:none}
  .tbtns .b-max{display:none}
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const WALLS = {
  dusk: { name: 'Alacakaranlık', draw(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#24163f'); sky.addColorStop(.45, '#5d2f63'); sky.addColorStop(.72, '#c96a6c'); sky.addColorStop(1, '#f2a76a');
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    const sx = w * .68, sy = h * .62, r = Math.min(w, h) * .09;
    const glow = g.createRadialGradient(sx, sy, 0, sx, sy, r * 5);
    glow.addColorStop(0, 'rgba(255,214,160,.55)'); glow.addColorStop(1, 'rgba(255,214,160,0)');
    g.fillStyle = glow; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ffd9a8'; g.beginPath(); g.arc(sx, sy, r, 0, 7); g.fill();
    const layers = ['#7a3a66', '#5a2a57', '#3d1d45', '#24122f'];
    layers.forEach((c, i) => {
      g.fillStyle = c; g.beginPath(); g.moveTo(0, h);
      const base = h * (.62 + i * .1), amp = h * (.05 - i * .006);

  }},
  sea: { name: 'Derin Deniz', draw(g, w, h) {
    const bg = g.createLinearGradient(0, 0, w * .3, h);

    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9; i++) {
      g.beginPath();
      const base = h * (.3 + i * .08);

        x ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.lineTo(w, h); g.lineTo(0, h); g.closePath();
      g.fillStyle = `rgba(120,230,220,${.035 + i * .01})`; g.fill();

    const r = rng(7);
    for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(200,255,250,${r() * .25})`; g.beginPath(); g.arc(r() * w, r() * h * .7, r() * 2.2 + .4, 0, 7); g.fill(); }
  }},
  garden: { name: 'Lale Bahçesi', draw(g, w, h) {
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#2b1638'); bg.addColorStop(1, '#13261d');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const r = rng(42), cols = ['240,88,125', '242,165,65', '229,72,77', '139,124,246', '255,140,170'];
    for (let i = 0; i < 26; i++) {
      const x = r() * w, y = h * (.25 + r() * .8), rad = Math.min(w, h) * (.06 + r() * .16);
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      const c = cols[i % cols.length];
      gr.addColorStop(0, `rgba(${c},.5)`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    for (let i = 0; i < 40; i++) {
      const x = r() * w, base = h, top = h * (.55 + r() * .3), s = Math.min(w, h) * (.012 + r() * .012);
      g.strokeStyle = 'rgba(70,140,90,.55)'; g.lineWidth = s * .35; g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + s, (base + top) / 2, x, top); g.stroke();
      g.fillStyle = `rgba(${cols[i % 3]},.85)`; g.beginPath();
      g.moveTo(x - s, top - s * .2); g.lineTo(x - s * .5, top - s * 1.7); g.lineTo(x, top - s * .9); g.lineTo(x + s * .5, top - s * 1.7); g.lineTo(x + s, top - s * .2);
      g.quadraticCurveTo(x, top + s * 1.2, x - s, top - s * .2); g.fill();

  night: { name: 'Yıldızlı Gece', draw(g, w, h) {

    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    const a = g.createLinearGradient(0, h * .2, w, h * .6);

    g.fillStyle = a; g.beginPath(); g.moveTo(0, h * .45);

let fs = store.get('fs', null) || defaultFS();
const fsListeners = new Set();
let fsTimer;
function fsChanged() {
  clearTimeout(fsTimer); fsTimer = setTimeout(() => store.set('fs', fs), 150);
  fsListeners.forEach(f => f());
}
function resolve(p, cwd = '/') {
  const parts = (p.startsWith('/') ? p : cwd + '/' + p).split('/'), out = [];
  for (const x of parts) { if (!x || x === '.') continue; if (x === '..') out.pop(); else out.push(x); }
  return '/' + out.join('/');
}
function getNode(p) {
  let n = fs;
  for (const part of p.split('/').filter(Boolean)) { if (n.type !== 'dir' || !n.children[part]) return null; n = n.children[part]; }
  return n;
}
function split(p) { const i = p.lastIndexOf('/'); return [p.slice(0, i) || '/', p.slice(i + 1)]; }
const join = (a, b) => a === '/' ? '/' + b : a + '/' + b;
function vErr(m) { const e = new Error(m); e.vfs = true; return e; }
function mk(p, node) {
  const [dir, name] = split(p), par = getNode(dir);
  if (!name) throw vErr('Geçersiz ad');
  if (!par || par.type !== 'dir') throw vErr(`Klasör bulunamadı: ${dir}`);
  if (par.children[name]) throw vErr(`Zaten var: ${name}`);
  par.children[name] = node; fsChanged();
}
function writeFile(p, content, append) {
  const n = getNode(p);
  if (n && n.type === 'dir') throw vErr(`${p} bir klasör`);
  if (n) n.content = append ? n.content + content : content;
  else { const [dir, name] = split(p), par = getNode(dir); if (!par || par.type !== 'dir') throw vErr(`Klasör bulunamadı: ${dir}`); par.children[name] = F(content); }
  fsChanged();
}
function removeNode(p) {
  const [dir, name] = split(p), par = getNode(dir);
  if (!par || !par.children[name]) throw vErr(`Bulunamadı: ${p}`);
  const n = par.children[name]; delete par.children[name]; fsChanged(); return n;
}
function moveNode(a, b) {
  if (b === a || b.startsWith(a + '/')) throw vErr('Bir klasör kendi içine taşınamaz');
  const n = getNode(a); if (!n) throw vErr(`Bulunamadı: ${a}`);
  const tgt = getNode(b); if (tgt && tgt.type === 'dir') b = join(b, split(a)[1]);
  if (getNode(b)) throw vErr(`Zaten var: ${b}`);
  const [dir] = split(b), par = getNode(dir); if (!par || par.type !== 'dir') throw vErr(`Klasör bulunamadı: ${dir}`);
  removeNode(a); par.children[split(b)[1]] = n; fsChanged();
}
function uniqueName(dir, base, ext = '') {

}
const isImg = (name, n) => /\.(png|jpe?g|gif|webp)$/i.test(name) && n && n.type === 'file' && n.content.startsWith('data:image');

  }

    [.25, .5, .75].forEach(f => { g.beginPath(); g.moveTo(0, H * f); g.lineTo(W, H * f); g.stroke(); });
    const a = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const pts = data.map((y, i) => [i / (data.length - 1) * W, H - 6 - y / 100 * (H - 12)]);
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.lineTo(W, H); g.lineTo(0, H); g.closePath();
    g.globalAlpha = .18; g.fillStyle = a; g.fill(); g.globalAlpha = 1;
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.strokeStyle = a; g.lineWidth = 2; g.stroke();
    const e = pts[pts.length - 1]; g.fillStyle = a; g.beginPath(); g.arc(e[0] - 3, e[1], 3.5, 0, 7); g.fill();
    $('tbody', w.body).innerHTML = [...WM.wins.values()].map(x => `<tr><td>${ico(x.app, 20)}${esc(x.title)}</td><td>${1000 + x.id}</td><td>${x.min ? 'Küçültülmüş' : x === WM.active ? 'Etkin' : 'Arka planda'}</td><td style="text-align:right">${x === w ? '' : `<button class="btn sm danger" data-kill="${x.id}">Sonlandır</button>`}</td></tr>`).join('');
  }
  w.body.addEventListener('click', e => { const b = e.target.closest('[data-kill]'); if (b) { const t = WM.wins.get(+b.dataset.kill); t && closeWin(t); tick(); } });
  const t = setInterval(tick, 1000); w.onClose.push(() => clearInterval(t));
  setTimeout(tick, 30);
}

/* Ayarlar */
function settingsApp(w) {
  w.body.innerHTML = `<div class="set">
    <section><h3>Duvar kâğıdı</h3><div class="walls">${Object.entries(WALLS).map(([k, v]) => `<button data-w="${k}"><canvas width="260" height="162"></canvas>${v.name}</button>`).join('')}</div></section>
    <section><h3>Vurgu rengi</h3><div class="swatches">${ACCENTS.map(a => `<button data-a="${a.c}" style="background:${a.c}" title="${a.n}" aria-label="${a.n}"></button>`).join('')}</div></section>
    <section><h3>Kullanıcı</h3><div class="card rowf"><label for="set-user" style="color:var(--muted)">Görünen ad</label><input id="set-user" class="field" maxlength="24" style="flex:1;min-width:140px"><button class="btn sm pri b-user">Kaydet</button></div></section>
    <section><h3>Sistem</h3><div class="card" style="display:flex;flex-direction:column;gap:14px">
      <dl class="about"><dt>Sürüm</dt><dd>Lale OS 1.0 "Tomurcuk"</dd><dt>Çekirdek</dt><dd>lale-web 1.0.0</dd><dt>Disk kullanımı</dt><dd class="a-disk"></dd><dt>Ekran</dt><dd class="a-scr"></dd></dl>
      <div class="rowf"><button class="btn sm danger b-reset">Dosya sistemini sıfırla</button><span class="reset-q" hidden style="font-size:13px">Tüm dosyalar silinecek. <button class="btn sm danger b-yes">Evet, sıfırla</button> <button class="btn sm b-no">Vazgeç</button></span></div>
    </div></section></div>`;
  $$('.walls button', w.body).forEach(b => { const c = $('canvas', b); WALLS[b.dataset.w].draw(c.getContext('2d'), 260, 162); });
  function mark() {
    $$('.walls button', w.body).forEach(b => b.classList.toggle('on', b.dataset.w === cfg.wall));
    $$('.swatches button', w.body).forEach(b => b.classList.toggle('on', b.dataset.a === cfg.accent));
    $('.a-disk', w.body).textContent = fmtSize(sizeOf(fs));
    $('.a-scr', w.body).textContent = `${innerWidth} × ${innerHeight}`;
  }
  $('#set-user', w.body).value = cfg.user;
  w.body.addEventListener('click', e => {
    const wb = e.target.closest('[data-w]'), ab = e.target.closest('[data-a]');
    if (wb) { cfg.wall = wb.dataset.w; saveCfg(); drawWall(); mark(); }
    if (ab) { cfg.accent = ab.dataset.a; saveCfg(); applyAccent(); mark(); }
  });
  const saveUser = () => { const v = $('#set-user', w.body).value.trim(); if (!v) return toast('Ad boş olamaz', true); cfg.user = v; saveCfg(); updUser(); toast('Kullanıcı adı güncellendi'); };
  $('.b-user', w.body).onclick = saveUser;
  $('#set-user', w.body).addEventListener('keydown', e => { if (e.key === 'Enter') saveUser(); });
  const q = $('.reset-q', w.body), rb = $('.b-reset', w.body);
  rb.onclick = () => { q.hidden = false; rb.hidden = true; };
  $('.b-no', w.body).onclick = () => { q.hidden = true; rb.hidden = false; };
  $('.b-yes', w.body).onclick = () => { fs = defaultFS(); fsChanged(); q.hidden = true; rb.hidden = false; mark(); toast('Dosya sistemi sıfırlandı'); };
  mark();
}

/* ---------- masaüstü, başlat menüsü ---------- */
const DESK = ['files', 'terminal', 'notes', 'calc', 'paint', 'calendar', 'dash', 'snake', 'monitor', 'settings'];
const icons = $('#icons');
icons.innerHTML = DESK.map(id => `<button class="dicon" data-app="${id}" role="listitem">${ico(id, 48)}<span>${APPS[id].name}</span></button>`).join('');
icons.addEventListener('click', e => {
  const b = e.target.closest('.dicon');
  $$('.dicon', icons).forEach(x => x.classList.toggle('sel', x === b));
  if (b && (lastPointer === 'touch' || lastPointer === 'pen')) openApp(b.dataset.app);
});
icons.addEventListener('dblclick', e => { const b = e.target.closest('.dicon'); if (b && lastPointer === 'mouse') openApp(b.dataset.app); });
icons.addEventListener('keydown', e => { const b = e.target.closest('.dicon'); if (b && e.key === 'Enter') { e.preventDefault(); openApp(b.dataset.app); } });
$('#os').addEventListener('contextmenu', e => {
  if (e.target.closest('.win, #taskbar, #start')) return;
  e.preventDefault();
  menu(e.clientX, e.clientY, [
    { l: 'Yeni metin belgesi', f: () => openApp('notes') },
    { l: 'Dosyaları aç', f: () => openApp('files') },
    { l: 'Terminal aç', f: () => openApp('terminal') },
    '-',
    { l: 'Sonraki duvar kâğıdı', f: () => { const k = Object.keys(WALLS); cfg.wall = k[(k.indexOf(cfg.wall) + 1) % k.length]; saveCfg(); drawWall(); } },
    { l: 'Ayarlar', f: () => openApp('settings') }
  ]);
});
$('#os').addEventListener('pointerdown', e => { if (e.target === $('#wall') || e.target === icons) $$('.dicon', icons).forEach(x => x.classList.remove('sel')); });

const start = $('#start'), search = $('#st-search');
function renderStart() {
  const q = search.value.trim().toLocaleLowerCase('tr');
  const list = Object.entries(APPS).filter(([, a]) => !a.hidden && a.name.toLocaleLowerCase('tr').includes(q));
  $('#st-apps').innerHTML = list.length ? list.map(([id, a], i) => `<button class="st-app${q && !i ? ' first' : ''}" data-app="${id}">${ico(id, 44)}<span>${a.name}</span></button>`).join('') : `<div class="st-empty">"${esc(search.value)}" ile eşleşen uygulama yok.</div>`;
}
function openStart() {
  const h = new Date().getHours();
  $('#st-greet').textContent = `${h < 6 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar'}, ${cfg.user}`;
  search.value = ''; renderStart();
  start.classList.remove('hide'); $('#startbtn').classList.add('on');
  if (!isMobile()) setTimeout(() => search.focus(), 30);
}
function closeStart() { start.classList.add('hide'); $('#startbtn').classList.remove('on'); }
$('#startbtn').onclick = () => start.classList.contains('hide') ? openStart() : closeStart();
search.addEventListener('input', renderStart);
search.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('.st-app', start); f && openApp(f.dataset.app); } if (e.key === 'Escape') closeStart(); });
$('#st-apps').addEventListener('click', e => { const b = e.target.closest('[data-app]'); b && openApp(b.dataset.app); });
addEventListener('pointerdown', e => { if (!start.classList.contains('hide') && !start.contains(e.target) && !e.target.closest('#startbtn')) closeStart(); });
function updUser() { $('#st-user').textContent = cfg.user; $('#st-av').textContent = cfg.user.trim()[0]?.toLocaleUpperCase('tr') || 'K'; }
updUser();

/* ---------- saat, kilit, açılış ---------- */
let bootAt = Date.now();
function tick() {
  const d = new Date(), t = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  $('#tr-t').textContent = t; $('#lk-t').textContent = t;
  $('#tr-d').textContent = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
  $('#lk-d').textContent = d.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 1000);
$('#tray').onclick = () => openApp('calendar');
const lock = $('#lock');
const doLock = () => { closeStart(); lock.classList.remove('hide'); lock.focus(); };
const unlock = () => lock.classList.add('hide');
$('#st-lock').onclick = doLock;
lock.addEventListener('click', unlock);
function boot(then) {
  const b = $('#boot'), bar = $('#boot-bar'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  b.classList.remove('hide'); bar.style.transition = 'none'; bar.style.width = '0';
  requestAnimationFrame(() => { bar.style.transition = `width ${reduce ? 200 : 1300}ms cubic-bezier(.4,.1,.2,1)`; bar.style.width = '100%'; });
  setTimeout(() => { b.classList.add('hide'); bootAt = Date.now(); then && then(); }, reduce ? 300 : 1500);
}
$('#st-restart').onclick = () => { closeStart(); [...WM.wins.values()].forEach(closeWin); boot(); };
$('#st-off').onclick = () => { closeStart(); [...WM.wins.values()].forEach(closeWin); $('#off').hidden = false; };
$('#poweron').onclick = () => { $('#off').hidden = true; boot(); };

/* ---------- klavye ---------- */
/* Meta (Windows/Cmd) tuşu yalnızca tek başına basılıp bırakılınca menüyü açar; Cmd+C gibi kısayollar menüyü açmaz. */
let metaAlone = false;
const isTyping = t => !!(t && t.matches && t.matches('input, textarea, select, [contenteditable=""], [contenteditable="true"]'));
addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (!lock.classList.contains('hide')) { if (!['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'AltGraph'].includes(e.key)) unlock(); e.preventDefault(); return; }
  metaAlone = e.key === 'Meta' || e.key === 'OS';
  if (e.key === 'Escape') { if (ctxEl || !start.classList.contains('hide')) { closeMenu(); closeStart(); return; } }
  if (e.altKey && !e.ctrlKey && e.code === 'KeyL') { e.preventDefault(); doLock(); return; }
  if (e.ctrlKey && e.key === 'Escape') { e.preventDefault(); start.classList.contains('hide') ? openStart() : closeStart(); return; }
  if (e.altKey && !e.ctrlKey && e.code === 'KeyW' && WM.active) { e.preventDefault(); closeWin(WM.active); return; }
  if (e.altKey && !e.ctrlKey && e.code === 'Backquote' && WM.wins.size) { e.preventDefault(); cycleWin(); return; }
  if (!start.classList.contains('hide') || isTyping(e.target)) return;
  const w = WM.active && !WM.active.min ? WM.active : null;
  if (w && w.onKey) { w.onKey(e); return; }
  if (!w && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== ' ') { openStart(); search.value = e.key; renderStart(); search.focus(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if ((e.key === 'Meta' || e.key === 'OS') && metaAlone) { metaAlone = false; start.classList.contains('hide') ? openStart() : closeStart(); return; }
  if (isTyping(e.target)) return;
  const w = WM.active && !WM.active.min ? WM.active : null;
  w && w.onKeyUp && w.onKeyUp(e);
});
addEventListener('blur', () => { WM.wins.forEach(w => w.onBlur && w.onBlur()); });
function cycleWin() {
  const list = [...WM.wins.values()].sort((a, b) => +a.el.style.zIndex - +b.el.style.zIndex);
  const w = list[0]; if (w.min) restore(w); focus(w);
}

/* Telefonda sanal klavye açılınca ekranı görünür alana sığdır; yazılan alan klavyenin altında kalmasın. */
const os = $('#os'), vv = window.visualViewport;
function fitViewport() {
  if (!vv) return;
  const kb = innerHeight - vv.height > 120;
  os.classList.toggle('kb', kb);
  os.style.height = kb ? vv.height + 'px' : '';
  os.style.top = kb ? vv.offsetTop + 'px' : '';
  os.style.bottom = kb ? 'auto' : '';
  const a = document.activeElement;
  if (kb && a && isTyping(a)) setTimeout(() => a.scrollIntoView({ block: 'nearest' }), 60);
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }

addEventListener('resize', () => { drawWall(); if (isMobile()) WM.wins.forEach(w => w.el.classList.add('max')); });
drawWall();
document.fonts && document.fonts.ready.then(() => {});
boot(() => { if (!store.get('seen', false)) { store.set('seen', true); openFile('/Belgeler/hoş-geldin.txt'); } });
})();
</script>
